name: Build Native Library

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK & NDK
        run: |
          # ubuntu-latest runners ship with the Android SDK preinstalled ($ANDROID_HOME).
          # The android-actions/setup-android@v3 action is avoided because it force-installs
          # the obsolete "tools" package that Google has removed from the SDK repositories.
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build for all architectures
        run: |
          NDK=$ANDROID_SDK_ROOT/ndk/26.1.10909125

          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "Building for $ABI..."
            mkdir -p build/$ABI
            cd build/$ABI

            cmake ../.. \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release

            cmake --build . --parallel
            cd ../..
          done

      - name: Package artifacts
        run: |
          mkdir -p dist/jniLibs
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p dist/jniLibs/$ABI
            cp build/$ABI/libcoverart.so dist/jniLibs/$ABI/
          done
          cd dist && zip -r ../libcoverart-jniLibs.zip jniLibs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcoverart-jniLibs
          path: dist/jniLibs
